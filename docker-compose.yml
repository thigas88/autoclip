services:
  # Serviço Redis
  redis:
    image: redis:7-alpine
    container_name: autoclip-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serviço de Aplicação Principal
  autoclip:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoclip-app
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"  # 后端API & 前端界面 (SPA)
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=production
      - DEBUG=true
      - LOG_LEVEL=INFO
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - MODEL_NAME=${MODEL_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Serviço Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoclip-celery-worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - MODEL_NAME=${MODEL_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL}
    command: celery -A backend.core.celery_app worker --loglevel=info --concurrency=2 -Q celery,processing
    depends_on:
      redis:
        condition: service_healthy
      autoclip:
        condition: service_healthy

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoclip-celery-beat
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
    command: celery -A backend.core.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      autoclip:
        condition: service_healthy

  # Flower monitoring service (optional)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoclip-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=production
    command: celery -A backend.core.celery_app flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: autoclip-network
